site_name: Documentation for pynxtools-raman
site_description: |
  The documentation for the pynxtools-raman plugin.
site_author: The NOMAD Authors
repo_url: https://github.com/FAIRmat-NFDI/pynxtools-raman
edit_uri: ""

nav:
  - Home: index.md
  - Tutorials:
    - tutorial/installation.md
    - tutorial/convert_your_first_dataset.md
    - tutorial/contributing.md
  - How-tos:
    - how-tos/convert_data.md
    - how-tos/adjust_the_config_file.md
    - how-tos/build_a_rod_upload_batch.md
    - how-tos/search_raman_data_in_nomad.md
  - Learn:
    - learn/application_definitions.md
    - learn/architecture.md
    - learn/readers.md
    - learn/nomad_integration.md
    - learn/rod_database_in_nomad.md
    - learn/versioning.md
  - Reference:
    - reference/cli.md
    - reference/witec.md
    - reference/rod.md
    - reference/app.md

plugins:
  - search

theme:
  name: material
  palette:
    primary: '#2A4CDF'
    accent: '#008A67'
  font:
    text: 'Titillium Web'
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
  custom_dir: docs/theme
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji
  - mkdocs-click
  - pymdownx.extra
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

use_directory_urls: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js